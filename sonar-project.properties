# Analyse de la qualité du code par SonarQube Cloud (D3 Q1),
# lancée par la CI GitHub Actions (.github/workflows/ci.yml)
sonar.organization=iojka
sonar.projectKey=iojka_grand-cinema-front
sonar.projectName=grand-cinema-front

# Code analysé : l'application React et les workflows GitHub Actions
sonar.sources=src,.github
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/setupTests.js
# Tests Vitest
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/setupTests.js

# Couverture mesurée par Vitest (fichier coverage/lcov.info de la CI)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.jsx
