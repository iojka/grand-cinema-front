# Intégration continue du front : à chaque push et à chaque pull request
# vers develop ou main, GitHub vérifie le code React et lance les tests.
name: CI front

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci installe exactement les versions du package-lock.json
      - name: Installer les dépendances
        run: npm ci

      - name: Analyser le code (ESLint)
        run: npm run lint

      - name: Vérifier la mise en forme (Prettier)
        run: npm run format:check

      - name: Lancer les tests (Vitest)
        run: npm run test

      # Vérifie que l'application se construit (ce qui sera déployé)
      - name: Construire l'application
        run: npm run build
