# Livraison continue du front : à chaque fusion sur develop, GitHub
# construit l'application React et la publie sur Azure Static Web Apps
# (préproduction, H-01).
name: CD front

on:
  push:
    branches: [develop]
  workflow_dispatch: # lancement à la main depuis l'onglet Actions

jobs:
  deploiement:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # L'adresse de l'API est intégrée au moment du build (Vite).
      # Ce n'est pas un secret : elle est visible dans le navigateur.
      - name: Construire l'application
        run: npm run build
        env:
          VITE_API_URL: https://ca-grandcinema-preprod-fr.niceriver-d1b5328b.francecentral.azurecontainerapps.io

      # Publication du dossier dist sur Static Web Apps.
      # Le jeton est rangé dans les secrets du dépôt GitHub.
      - name: Publier sur Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
